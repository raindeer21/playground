<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>free6gc — Extension Lifecycle</title><style>
:root{--b:#0866e5;--t:#172033;--m:#68758a;--l:#e4e9f1;--g:#17a75f;--bg:#fff;font:14px Inter,ui-sans-serif,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:var(--t)}*{box-sizing:border-box}body{margin:0;background:#fff}.shell{height:100vh;display:grid;grid-template:72px 1fr/214px minmax(700px,1fr) 320px}.top{grid-column:1/-1;border-bottom:1px solid var(--l);display:flex;align-items:center;padding:0 24px;gap:18px}.brand{font-size:25px;font-weight:800;display:flex;align-items:center;gap:12px}.logo{width:38px;height:38px;border:3px solid var(--b);color:var(--b);transform:rotate(30deg);border-radius:9px}.spacer{flex:1}.status{font-size:13px;color:#455167}.dot{width:8px;height:8px;border-radius:50%;background:#13b45d;display:inline-block;margin-right:7px}.side{border-right:1px solid var(--l);padding:16px 0;display:flex;flex-direction:column}.nav{height:52px;padding:0 24px;display:flex;align-items:center;gap:12px;color:#4f5c72}.nav.active{background:#eef5ff;color:var(--b);border-left:4px solid var(--b);font-weight:700}.main{overflow:auto;padding:24px 36px 40px}.rail{border-left:1px solid var(--l);padding:42px 22px;overflow:auto}.crumb{color:#7a8496;font-size:13px}.crumb b{color:var(--b)}h1{font-size:22px;margin:28px 0 28px}.stepper{display:flex;border-bottom:1px solid var(--l);padding-bottom:28px}.step{flex:1;text-align:center;color:#748096;cursor:pointer;position:relative}.step:not(:last-child):after{content:"";position:absolute;left:64%;right:-36%;top:14px;height:1px;background:#cad3df}.circ{width:29px;height:29px;border-radius:50%;border:1px solid #bdc7d5;margin:auto auto 8px;display:grid;place-items:center;background:#fff;position:relative;z-index:1}.step.on,.step.done{color:var(--b);font-weight:700}.step.on .circ,.step.done .circ{background:var(--b);color:#fff;border-color:var(--b)}.step.done .circ{font-size:0}.step.done .circ:before{content:"✓";font-size:12px}.content{padding-top:24px;max-width:980px;margin:auto}.ph{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px}.ph strong{font-size:18px}.help{color:var(--b);font-size:12px}.card{border:1px solid var(--l);border-radius:12px;background:#fff;padding:18px}.grid2{display:grid;grid-template-columns:1fr 1fr;gap:18px}.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:18px}.muted{color:var(--m);font-size:12px}.btn{height:42px;border:1px solid #d4dce8;border-radius:8px;background:#fff;padding:0 16px;font-weight:650;cursor:pointer}.btn.p{background:var(--b);color:white;border-color:var(--b)}.footer{display:flex;justify-content:space-between;margin-top:28px;padding-top:24px;border-top:1px solid var(--l)}.source{min-height:180px;display:flex;flex-direction:column}.source h3{margin:0 0 8px}.source .btn{margin-top:auto}.plugins{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}.plugin{cursor:pointer}.plugin.sel{border:2px solid var(--b)}.acn{width:52px;height:52px;border-radius:9px;background:#0b4e9c;color:#fff;display:grid;place-items:center;font-weight:800;font-size:18px}.badge{display:inline-block;padding:4px 9px;border-radius:7px;background:#eef5ff;color:var(--b);font-size:10px;margin:4px}.badge.g{background:#eaf9f1;color:#138b4f}.summary{border:1px solid var(--l);border-radius:12px;overflow:hidden}.shead{display:flex;gap:12px;padding:20px;border-bottom:1px solid var(--l)}.srow{height:60px;border-bottom:1px solid var(--l);padding:0 18px;display:flex;align-items:center}.srow span:last-child{margin-left:auto;font-weight:650}.roll{padding:18px}.item{padding:10px 0;border-bottom:1px solid #edf0f5}.check{color:var(--g);font-weight:800}.banner{padding:16px;border:1px solid #9ddbb8;border-radius:9px;background:#f0fbf5;color:#158d50;text-align:center;font-size:20px;font-weight:800;margin:16px 0}.metrics{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}.metric{text-align:center;padding:12px}.metric b{font-size:22px;display:block}.arch{min-height:360px;display:grid;place-items:center}.arch svg{width:100%;max-height:350px}.radio,.ue{display:flex;gap:10px;align-items:center;padding:9px}.r{width:18px;height:18px;border-radius:50%;border:2px solid #c7d0dc}.radio.sel .r{border:6px solid var(--b)}.box{width:18px;height:18px;border:1px solid #c7d0dc;border-radius:4px}.ue.sel .box{background:var(--b);color:white;text-align:center}.ue .ip{margin-left:auto}.rule{font-family:ui-monospace,monospace;background:#f7f9fc;padding:14px;border-radius:8px}.scenario{padding:11px;border-radius:8px}.scenario.sel{background:#eef5ff;color:var(--b);border:1px solid #bad2ff}.trace{font-size:11px;line-height:2}.delta{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;text-align:center}.delta b{display:block;font-size:18px}.result{display:grid;grid-template-columns:72px 1fr;gap:20px;align-items:center}.bigcheck{width:68px;height:68px;border-radius:50%;background:#eaf9f1;color:var(--g);font-size:34px;display:grid;place-items:center}.actions{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;margin-top:18px}.act{padding:20px}.act.p{background:var(--b);color:#fff}.mono{font-family:ui-monospace,monospace}.tbl{display:grid;grid-template-columns:1fr 1fr;gap:16px}.kclabel{background:#eefbf4;border:1px solid #b9e7ca;padding:12px;border-radius:8px}.ec{background:#f5f8ff;border:1px solid #bfd4fb;padding:12px;border-radius:8px}@media(max-width:1180px){.shell{grid-template-columns:190px 1fr}.rail{display:none}}@media(max-width:850px){.shell{display:block;height:auto}.side{display:none}.main{padding:18px}.top .status{display:none}.grid2,.grid3,.plugins,.tbl,.actions{grid-template-columns:1fr}.stepper{overflow:auto}.step{min-width:84px}.delta{grid-template-columns:repeat(2,1fr)}}
</style></head><body><div class="shell"><header class="top"><div class="brand"><div class="logo"></div>free6gc</div><div class="spacer"></div><div class="status"><span class="dot"></span>Production</div><div class="status">Cluster: <b>prod-us-east-1</b></div><div class="status"><span class="check">✓</span> All Systems Operational</div><div>?</div><div class="acn" style="width:34px;height:34px;border-radius:50%;font-size:11px">AE</div></header><aside class="side"><div class="nav">▦ Overview</div><div class="nav">▤ Procedures</div><div class="nav">♧ Sessions</div><div class="nav">⌘ User Plane</div><div class="nav active">✚ Extensions</div><div class="nav">⌁ Traces</div></aside><main class="main"><div class="crumb"><b>Extensions</b> &nbsp;/&nbsp; Install ACN</div><h1>Extension Lifecycle</h1><div id="steps" class="stepper"></div><div id="root" class="content"></div></main><aside class="rail"><div id="summary"></div></aside></div><script>
const phases=['Acquire','Inspect','Resolve','Install','Integrate','Activate','Beta Test','Effects','Promote'];let cur=0;const root=document.querySelector('#root'),steps=document.querySelector('#steps'),summary=document.querySelector('#summary');function stepper(){steps.innerHTML=phases.map((p,i)=>`<div class="step ${i<cur?'done':i===cur?'on':''}" onclick="go(${i})"><div class="circ">${i+1}</div>${p}</div>`).join('')}function header(){return `<div class="ph"><strong>${cur+1}. ${phases[cur]}</strong><span class="help">ⓘ Need help?</span></div>`}function foot(next='Continue'){return `<div class="footer"><button class="btn" onclick="go(Math.max(0,cur-1))">Back</button><button class="btn p" onclick="go(Math.min(8,cur+1))">${next} →</button></div>`}function sum(){let st=['Not Installed','Package Selected','Eligible','Installing','Integrated','Beta Ready','Beta Running','Beta Active','Passed'][cur];summary.innerHTML=`<div class="summary"><div class="shead"><div class="acn">ACN</div><div><b style="font-size:17px">ACN</b><div class="muted">Agent Communication Network</div><span class="badge ${cur>1?'g':''}">${st}</span></div></div>${[['Version','1.0.0'],['Status',st],['Modules','5'],['Procedures','3'],['Routes','12'],['Permissions','8'],['Dependencies','3'],['Scope','Cluster']].map(x=>`<div class="srow"><span>${x[0]}</span><span>${x[1]}</span></div>`).join('')}<div class="roll"><b>Rollback</b><p class="muted">Available after activation.</p><button class="btn" style="width:100%" ${cur<6?'disabled':''}>Rollback</button></div></div>`}function acquire(){return `${header()}<div class="grid2"><div class="card source"><h3>Registry</h3><p class="muted">Browse extension packages.</p><button class="btn">Browse registry</button></div><div class="card source"><h3>Upload Package</h3><p class="muted">Select a local extension package.</p><button class="btn">Upload package</button></div></div><div class="ph" style="margin-top:24px"><b>Registry results</b><span class="help">View all</span></div><div class="plugins"><div class="card plugin"><b>NWDAF Advanced</b><p class="muted">Network Data Analytics Function</p><span class="badge">Official</span><span class="badge g">Compatible</span></div><div class="card plugin sel"><div style="display:flex;gap:12px"><div class="acn">ACN</div><div><b>ACN</b><p class="muted">Agent Communication Network</p></div></div><span class="badge">Official</span><span class="badge g">Signed</span><span class="badge g">Compatible</span></div><div class="card plugin"><b>SecGW</b><p class="muted">Security Gateway Extension</p><span class="badge">Official</span><span class="badge g">Compatible</span></div></div>${foot('Review package')}`}function inspect(){return `${header()}<div class="card"><div style="display:flex;align-items:center;gap:14px"><div class="acn">ACN</div><div><b>ACN</b><div class="muted">Agent Communication Network</div></div><span class="badge g" style="margin-left:auto">Signed</span></div></div><div class="grid3" style="margin-top:18px"><div class="card"><b>Components</b>${['ACF','VN Controller','acn_group_v1','ACN NAS Schema'].map(x=>`<div class="item">${x}</div>`).join('')}</div><div class="card"><b>Extension Methods</b>${['CSF Orchestration','Extension API','Rule / Route','Event'].map(x=>`<div class="item">${x}</div>`).join('')}</div><div class="card"><b>Requested Access</b>${['session.view','up.policy.manage','nas.container:0x0E','session.active','session.released'].map(x=>`<div class="item mono">${x}</div>`).join('')}</div></div><div class="card" style="margin-top:18px"><div>Direct KC internals: <b>None</b></div><div>Direct UPF access: <b>None</b></div><div>Key access: <b>None</b></div></div>${foot('Resolve dependencies')}`}function resolve(){return `${header()}<div class="card"><b>Compatibility & Dependency Plan</b><div class="tbl" style="margin-top:16px"><div class="ec"><b>EC Dependencies</b>${['IDM ≥ 1.2','MoQ Control','ACF Runtime'].map(x=>`<div class="item">✓ ${x}</div>`).join('')}</div><div class="kclabel"><b>KC Capabilities</b>${['CSF Runtime','Session View','UP Control','NAS Extensible Codec','Route Selector','Session Events'].map(x=>`<div class="item">✓ ${x}</div>`).join('')}</div></div><div class="banner">✓ Fast-Track Eligible</div><div class="grid3"><div class="metric"><span class="muted">KC code changes</span><b>0</b></div><div class="metric"><span class="muted">Restart required</span><b>No</b></div><div class="metric"><span class="muted">Baseline procedures</span><b>Unchanged</b></div></div></div>${foot('Install extension')}`}function install(){let x=['Verify signature','Install IDM','Deploy ACF','Deploy VN Controller','Register manifest','Register procedure','Commit version'];return `${header()}<div class="card"><div class="ph"><b>Installation Transaction</b><b>5 / 7</b></div>${x.map((a,i)=>`<div class="item"><span class="${i<4?'check':''}">${i<4?'✓':i===4?'◉':'○'}</span> ${a}<span style="float:right;color:${i<4?'#17a75f':i===4?'#0866e5':'#9aa4b4'}">${i<4?'Completed':i===4?'Installing':'Pending'}</span></div>`).join('')}</div><div class="card" style="margin-top:16px"><b>Installation Effect</b><div class="metrics">${['KC restarts','UE sessions touched','UPF policies changed','Routes active'].map(x=>`<div class="metric"><span class="muted">${x}</span><b>0</b></div>`).join('')}</div></div>${foot('Configure integration')}`}function integrate(){return `${header()}<div class="card arch"><svg viewBox="0 0 760 330"><rect x="250" y="20" width="260" height="105" rx="12" fill="#f6f9ff" stroke="#76a6f4"/><text x="380" y="48" text-anchor="middle" fill="#214c8e" font-size="18" font-weight="700">ACN Extension</text><rect x="280" y="70" width="85" height="35" rx="6" fill="white" stroke="#7da9ee"/><text x="322" y="92" text-anchor="middle">ACF</text><rect x="395" y="70" width="90" height="35" rx="6" fill="white" stroke="#7da9ee"/><text x="440" y="92" text-anchor="middle">VN Controller</text>${[['CSF Runtime',95],['Session View',235],['Session Events',375],['SRF Route',515],['UP Control',655]].map((x,i)=>`<line x1="${i<2?322:440}" y1="125" x2="${x[1]}" y2="220" stroke="#8a98ac"/><rect x="${x[1]-50}" y="220" width="100" height="52" rx="8" fill="#f1fbf5" stroke="#8ad0a5"/><text x="${x[1]}" y="250" text-anchor="middle" font-size="12">${x[0]}</text>`).join('')}<text x="380" y="305" text-anchor="middle" fill="#3f6b54" font-size="15" font-weight="700">KC Capabilities</text></svg></div><div class="grid2" style="margin-top:16px"><div class="card"><b>Baseline Procedures</b><div class="item">Initial Registration <span style="float:right">Unchanged</span></div><div class="item">PDU Session Establishment <span style="float:right">Unchanged</span></div></div><div class="card"><b>Added Procedure</b><div class="item">ACN Group Communication <span class="badge">Trigger: 0x0E</span></div></div></div>${foot('Prepare beta activation')}`}function activate(){let u=[['Agent A','10.60.0.11',1],['Agent B','10.60.0.12',1],['Agent C','10.60.0.13',1],['UE 004','10.60.0.14',0],['UE 005','10.60.0.15',0]];return `${header()}<div class="grid2"><div><div class="card"><b>Activation Mode</b><div class="radio"><div class="r"></div>Shadow</div><div class="radio sel"><div class="r"></div>Canary</div><div class="radio"><div class="r"></div>General Availability</div></div><div class="card" style="margin-top:16px"><span class="muted">Canary scope</span><b style="display:block;font-size:24px">3 / 24</b><span class="muted">connected UEs</span></div></div><div class="card"><b>Eligible UEs</b>${u.map(x=>`<div class="ue ${x[2]?'sel':''}"><div class="box">${x[2]?'✓':''}</div>${x[0]}<span class="ip">${x[1]}</span></div>`).join('')}</div></div><div class="card" style="margin-top:16px"><b>Routing Rule</b><div class="rule" style="margin-top:10px"><b style="color:#9d44c2">IF</b> NAS Container = 0x0E<br><b style="color:#9d44c2">AND</b> UE in ACN Beta<br><b style="color:#9d44c2">THEN</b> procedure = <span style="color:#0866e5">acn-group-create:v1</span></div></div>${foot('Activate for 3 UEs')}`}function beta(){return `${header()}<div style="display:grid;grid-template-columns:210px 1fr;gap:16px"><div class="card"><b>Scenarios</b>${['Create ACN Group','Unauthorized UE-to-UE','Normal Traffic','Session Loss','Rollback'].map((x,i)=>`<div class="scenario ${i===0?'sel':''}">${x}</div>`).join('')}</div><div><div class="card arch"><svg viewBox="0 0 620 260">${[['Agent A',90,'#eaf9f1'],['Agent B',310,'#eef5ff'],['Agent C',530,'#f5efff']].map(x=>`<rect x="${x[1]-38}" y="25" width="76" height="48" rx="9" fill="${x[2]}" stroke="#7aa7ea"/><text x="${x[1]}" y="54" text-anchor="middle">${x[0]}</text><line x1="${x[1]}" y1="73" x2="310" y2="180" stroke="#2aaa62" stroke-dasharray="4 4"/>`).join('')}<text x="310" y="135" text-anchor="middle" fill="#24985a">Existing PDU Sessions</text><rect x="270" y="180" width="80" height="52" rx="9" fill="#eef5ff" stroke="#7aa7ea"/><text x="310" y="211" text-anchor="middle">UPF</text></svg></div><div class="grid2" style="margin-top:16px"><div class="card"><b>Trace</b><div class="trace">✓ SRF verified<br>✓ Route selected<br>✓ ACF creating group<br>✓ VN resolved sessions<br>✓ UP Control reconciled<br>✓ GroupInfo acknowledged</div></div><div class="card"><b>Invariants</b><div class="trace">✓ KC restarts &nbsp; 0<br>✓ PDU sessions rebuilt &nbsp; 0<br>✓ UE IPv4 changed &nbsp; 0<br>✓ baseline unaffected<br>✓ A→B allowed<br>✓ A→non-member denied</div></div></div></div></div>${foot('View effects')}`}function effects(){return `${header()}<div class="grid2"><div class="card"><b>Before</b><div class="arch"><svg viewBox="0 0 420 260">${['A','B','C'].map((x,i)=>`<rect x="30" y="${40+i*75}" width="80" height="38" rx="6" fill="#f6f9ff" stroke="#6c9cea"/><text x="70" y="${64+i*75}" text-anchor="middle">Agent ${x}</text><line x1="110" y1="${59+i*75}" x2="265" y2="135" stroke="#53647b"/>`).join('')}<rect x="265" y="115" width="60" height="40" rx="6" fill="#f5efff" stroke="#9a78d8"/><text x="295" y="140" text-anchor="middle">UPF</text><rect x="350" y="115" width="45" height="40" rx="6" fill="#effbf4" stroke="#78c493"/><text x="372" y="140" text-anchor="middle">N6</text><line x1="325" y1="135" x2="350" y2="135" stroke="#53647b"/><text x="135" y="105" fill="#e45050" font-size="20">×</text><text x="135" y="178" fill="#e45050" font-size="20">×</text></svg></div></div><div class="card"><b>ACN Beta Active</b><div class="arch"><svg viewBox="0 0 420 260">${['A','B','C'].map((x,i)=>`<rect x="25" y="${40+i*75}" width="78" height="38" rx="6" fill="#f6f9ff" stroke="#6c9cea"/><text x="64" y="${64+i*75}" text-anchor="middle">Agent ${x}</text><line x1="103" y1="${59+i*75}" x2="190" y2="135" stroke="#2aaa62" stroke-dasharray="4 4"/>`).join('')}<rect x="190" y="100" width="90" height="70" rx="8" fill="#effbf4" stroke="#78c493"/><text x="235" y="128" text-anchor="middle" fill="#298952">ACN Group</text><text x="235" y="148" text-anchor="middle" fill="#298952">Local-Switch</text><rect x="305" y="115" width="50" height="40" rx="6" fill="#f5efff" stroke="#9a78d8"/><text x="330" y="140" text-anchor="middle">UPF</text><rect x="375" y="115" width="38" height="40" rx="6" fill="#effbf4" stroke="#78c493"/><text x="394" y="140" text-anchor="middle">N6</text></svg></div></div></div><div class="card" style="margin-top:16px"><b>Network Delta</b><div class="delta" style="margin-top:14px">${[['+1','Logical Group'],['+3','UP Policies'],['+1','Internal Network'],['+6','Peer Directions'],['0','New PDU Sessions'],['0','New UE Addresses'],['0','Baseline Changes']].map(x=>`<div><b>${x[0]}</b><span class="muted">${x[1]}</span></div>`).join('')}</div></div>${foot('Review promotion')}`}function promote(){return `${header()}<div class="card result"><div class="bigcheck">✓</div><div><h2 style="margin:0">Beta Result — <span style="color:#17a75f">Passed</span></h2><div class="grid3" style="margin-top:18px"><div><b style="font-size:20px">3 / 3</b><div class="muted">Test UEs Passed</div></div><div><b style="font-size:20px">6 / 6</b><div class="muted">Assertions Passed</div></div><div><b style="font-size:20px">0</b><div class="muted">Baseline Regressions</div></div></div></div></div><div class="card" style="margin-top:18px"><b>Deployment Decision</b><div class="actions"><div class="card act">↶ <b>Roll Back</b><div class="muted">Revert to previous version</div></div><div class="card act">↗ <b>Expand Canary</b><div class="muted">Increase canary scope</div></div><div class="card act p">🚀 <b>Promote</b><div>Promote to all clusters</div></div></div></div><div class="card" style="margin-top:18px"><b>Release Summary</b><div class="grid2" style="margin-top:12px"><div>✓ Installed<br>✓ Integrated</div><div>✓ Active<br>✓ Test Passed</div></div></div><div class="footer"><span></span><button class="btn p">Promote 🚀</button></div>`}const renders=[acquire,inspect,resolve,install,integrate,activate,beta,effects,promote];function go(i){cur=i;stepper();sum();root.innerHTML=renders[i]();window.scrollTo(0,0)}go(0);
</script></body></html>
