<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>free6gc — Extension Lifecycle</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="app-shell">
    <header class="topbar">
      <div class="brand">
        <div class="brand-mark" aria-hidden="true">
          <svg viewBox="0 0 48 48"><path d="M24 3 42 13v22L24 45 6 35V13L24 3Z" fill="none" stroke="currentColor" stroke-width="3"/><path d="m14 17 10-6 10 6v12l-10 6-10-6V17Z" fill="none" stroke="currentColor" stroke-width="3"/><path d="M24 11v12m10-6-10 6-10-6m10 6v12" fill="none" stroke="currentColor" stroke-width="3"/></svg>
        </div>
        <span>free6gc</span>
      </div>
      <div class="topbar-spacer"></div>
      <button class="topbar-item ghost"><span class="status-dot green"></span>Production <span class="chevron">⌄</span></button>
      <div class="top-divider"></div>
      <button class="topbar-item ghost">Cluster: <strong>prod-us-east-1</strong> <span class="chevron">⌄</span></button>
      <div class="top-divider"></div>
      <div class="topbar-item"><span class="check-ring">✓</span>All Systems Operational</div>
      <div class="top-divider"></div>
      <button class="icon-btn" aria-label="Help">?</button>
      <button class="avatar-btn" aria-label="User menu"><span class="avatar">AE</span><span class="chevron">⌄</span></button>
    </header>

    <aside class="sidebar">
      <nav class="nav-list">
        <button class="nav-item"><span class="nav-icon">▦</span><span>Overview</span></button>
        <button class="nav-item"><span class="nav-icon">▤</span><span>Procedures</span></button>
        <button class="nav-item"><span class="nav-icon">♧</span><span>Sessions</span></button>
        <button class="nav-item"><span class="nav-icon">⌘</span><span>User Plane</span></button>
        <button class="nav-item active"><span class="nav-icon">✚</span><span>Extensions</span></button>
        <button class="nav-item"><span class="nav-icon">⌁</span><span>Traces</span></button>
      </nav>
      <button class="collapse-btn">« <span>Collapse</span></button>
    </aside>

    <main class="main">
      <div class="main-header">
        <div class="breadcrumb"><span>Extensions</span><b>/</b><span>Install ACN</span></div>
        <h1>Extension Lifecycle</h1>
        <div id="stepper" class="stepper" aria-label="Extension lifecycle phases"></div>
      </div>
      <div id="phase-root" class="phase-root"></div>
    </main>

    <aside class="right-rail">
      <div id="summary-card" class="summary-card"></div>
    </aside>
  </div>

  <div id="toast" class="toast" role="status" aria-live="polite"></div>
  <input id="file-upload" type="file" hidden />
  <script src="app.js"></script>
</body>
</html>
